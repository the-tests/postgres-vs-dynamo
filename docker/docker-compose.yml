name: db-perf-check

services:
  postgres:
    image: postgres:16.2-bookworm
    mem_limit: 1G
    cpus: 1
    cpu_shares: 512
    networks:
      db-perf-check:
        aliases:
          - postgres
          - postgresql
    healthcheck:
      test: ["CMD", "psql", "-tq", "--port", "5432", "--host", "localhost", "--user", "admin", "--db", "testdb", "--command", "SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES LIMIT 1;"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 10s
    environment:
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: testdb
      POSTGRES_USER: admin
    ports:
      - "5432:5432"

  # TODO: mongodb is not tested
