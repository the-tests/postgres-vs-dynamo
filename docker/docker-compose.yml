  #     ME_CONFIG_MONGODB_URL: mongodb://admin:admin1234@mongodb:27017/
  #     ME_CONFIG_BASICAUTH: false
  #   networks:
  #     - db-perf-check

  dynamodb:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ."
    image: "amazon/dynamodb-local:2.5.4"
    mem_limit: 1G
    cpus: 1
    cpu_shares: 512
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 2>/dev/null; if [ $$? -eq 22 ]; then exit 0; else exit 1; fi"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 10s
    ports:
      - "8000:8000"
    networks:
      db-perf-check:
        aliases:
          - dynamodb

  dynamodb-admin:
    image: "aaronshaf/dynamodb-admin:5.1.3"
    cpu_shares: 128
    ports:
      - "8082:8082"
    environment:
      - HOST=0.0.0.0
      - PORT=8082
      - AWS_REGION=us-west-2
      - DYNAMO_ENDPOINT=http://dynamodb:8000
    networks:
      - db-perf-check

networks:
  db-perf-check:
    name: db-perf-check
    ipam:
      driver: default
      config:
        - subnet: "10.0.11.32/28"
