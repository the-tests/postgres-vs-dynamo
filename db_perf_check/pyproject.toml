[project]
name = "db-perf-check"
version = "0.1.0"
description = "A tool to compare performance for simple select queries of key-value data between postgres and dynamodb"
authors = [
    {name = "Name",email = "email@example.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "aioboto3 (>=14.1.0,<15.0.0)",
    "uvloop (>=0.21.0,<0.22.0)",
    "asyncpg (>=0.30.0,<0.31.0)"
]

[tool.poetry]
packages = [{include = "db_perf_check", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
